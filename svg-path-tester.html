<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Path Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
            padding: 10px;
            font-family: monospace;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }
        .preview {
            width: 100%;
            height: 600px;
            background: #000;
            border: 2px solid #f95900;
            margin: 20px 0;
        }
        button {
            background: #f95900;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover {
            background: #ff6b1a;
        }
        .presets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        h1 { color: #f95900; }
        h2 { color: #ff6b1a; margin-top: 30px; }
        .info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SVG Path Tester for Your Projects Page</h1>

        <div class="info">
            <strong>How to use:</strong>
            <ol>
                <li>Click a preset or paste your own path in the text area below</li>
                <li>See the preview update in real-time</li>
                <li>Copy the path value and paste it into your projects.jsx file (line 134)</li>
            </ol>
        </div>

        <h2>Preset Paths:</h2>
        <div class="presets">
            <button onclick="setPath('original')">Original (Studio Kogel)</button>
            <button onclick="setPath('smooth-s')">Smooth S-Curve</button>
            <button onclick="setPath('gentle-wave')">Gentle Wave</button>
            <button onclick="setPath('zigzag')">Zigzag</button>
            <button onclick="setPath('diagonal')">Simple Diagonal</button>
            <button onclick="setPath('flowing')">Flowing Curve</button>
        </div>

        <h2>Custom Path:</h2>
        <label>
            <strong>Path d attribute:</strong>
            <textarea id="pathInput" oninput="updatePreview()"></textarea>
        </label>

        <h2>Preview:</h2>
        <svg id="preview" class="preview" viewBox="0 0 1712.203 3286.62" preserveAspectRatio="none">
            <defs>
                <linearGradient id="grad" x1="0.5" x2="0.5" y2="1">
                    <stop offset="0" stop-color="#1a1a1a" stop-opacity="0" />
                    <stop offset="1" stop-color="#1a1a1a" />
                </linearGradient>
            </defs>
            <g transform="matrix(1, 0, 0, 1, 0, 0)">
                <path id="previewPath" fill="none" stroke="#f95900" stroke-width="5"/>
            </g>
            <rect width="1649.33" height="180" transform="translate(32.5 3105.472)" fill="url(#grad)"/>
        </svg>

        <button onclick="copyPath()">📋 Copy Path to Clipboard</button>
    </div>

    <script>
        const paths = {
            'original': 'M3783.544,1173s-215.614,32.312-261.132,439.434S3098.258,2107.94,2877.975,2143.4c-176.579,32.284-732.367,44.5-743.764,410.187,1.708,138.474,71.887,355.443,591.229,518.267s1476.35,497.883,792.864,785.1c-260.408,109.428-497.52,371.8-511.872,539.99',
            'smooth-s': 'M 1600 0 Q 1200 400, 1000 800 Q 800 1200, 600 1600 Q 400 2000, 800 2400 Q 1200 2800, 1000 3200 Q 800 3600, 600 4000',
            'gentle-wave': 'M 1400 0 Q 1200 600, 900 1200 Q 600 1800, 800 2400 Q 1000 3000, 700 3600 Q 500 4200, 400 4800',
            'zigzag': 'M 1500 0 L 1200 800 L 1500 1600 L 1200 2400 L 1500 3200 L 1200 4000',
            'diagonal': 'M 1600 0 L 200 4000',
            'flowing': 'M 1500 0 C 1300 500, 1100 800, 900 1200 C 700 1600, 500 2000, 700 2400 C 900 2800, 1100 3200, 900 3600 C 700 4000, 500 4400, 300 4800'
        };

        // Set initial path
        setPath('original');

        function setPath(preset) {
            const path = paths[preset];
            document.getElementById('pathInput').value = path;
            updatePreview();
        }

        function updatePreview() {
            const pathValue = document.getElementById('pathInput').value;
            const pathElement = document.getElementById('previewPath');

            // Apply transform to match your setup
            pathElement.setAttribute('d', pathValue);
            pathElement.setAttribute('transform', 'translate(-2101.71 -1140.53)');
        }

        function copyPath() {
            const pathValue = document.getElementById('pathInput').value;
            navigator.clipboard.writeText(pathValue).then(() => {
                alert('✅ Path copied to clipboard!\n\nNow paste it in projects.jsx at line 134');
            });
        }

        // Update preview on load
        updatePreview();
    </script>
</body>
</html>
